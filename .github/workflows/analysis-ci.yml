name: Studio analysis validation
on:
  pull_request:
    paths:
      - "app/api/analysis/**"
      - "app/[lang]/studio-analyse/**"
      - "components/analysis/**"
      - "lib/analysis/**"
      - "tests/analysis.test.ts"
      - ".github/workflows/analysis-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
