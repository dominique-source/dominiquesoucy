name: Studio HD renderer validation
on:
  pull_request:
    paths:
      - 'render-engine/**'
      - 'lib/analysis/hd-render-manifest.ts'
      - 'components/analysis/capsule-workshop.tsx'
      - '.github/workflows/studio-hd-renderer.yml'
  push:
    branches: [main]
    paths:
      - 'render-engine/**'
      - 'lib/analysis/hd-render-manifest.ts'
      - '.github/workflows/studio-hd-renderer.yml'
permissions:
  contents: read
jobs:
  renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install renderer dependencies
        working-directory: render-engine
        run: npm install --no-audit --no-fund
      - name: Typecheck renderer
        working-directory: render-engine
        run: npm run typecheck
